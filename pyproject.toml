[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-audit"
version = "0.1.0"
description = "Privacy-bounded local lifecycle audit for agent runtimes."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agent-runtime-audit = "agent_runtime_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
